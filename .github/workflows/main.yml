name: CI/CD Auto Deploy to Linux VM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/src/CloudServiceStore/CloudServiceStore.sln

      - name: Build Solution
        run: dotnet build src/backend/src/CloudServiceStore/CloudServiceStore.sln --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test src/backend/tests/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj --no-build -c Release

  deploy:
    name: Deploy to Google Cloud Linux VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          script: |
            set -e
            echo "==== Starting Auto-Deploy Process on VM ===="
            if [ ! -d "PTPM-OOP" ]; then
              git clone https://github.com/${{ github.repository }}.git PTPM-OOP
              cd PTPM-OOP
            else
              cd PTPM-OOP
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "==== Writing .env (PayOS/Resend) from GitHub Secrets ===="
            {
              echo "App__PayOsClientId=${{ secrets.PAYOS_CLIENT_ID }}"
              echo "App__PayOsApiKey=${{ secrets.PAYOS_API_KEY }}"
              echo "App__PayOsChecksumKey=${{ secrets.PAYOS_CHECKSUM_KEY }}"
              echo "App__ResendApiKey=${{ secrets.RESEND_API_KEY }}"
              echo "App__EmailFromAddress=${{ secrets.EMAIL_FROM_ADDRESS }}"
              echo "App__EmailFromName=${{ secrets.EMAIL_FROM_NAME }}"
            } > .env
            echo "==== Building Docker Images & Starting Containers (No Cache) ===="
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "==== Updating Nginx Reverse Proxy Config ===="
            chmod +x scripts/update-nginx.sh || true
            bash scripts/update-nginx.sh
            echo "==== Installing Certbot deploy-hook (self-heal Nginx after SSL renew) ===="
            sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            sudo cp scripts/update-nginx.sh /etc/letsencrypt/renewal-hooks/deploy/reapply-nginx.sh
            sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reapply-nginx.sh
            echo "==== Deploy Completed Successfully! ===="

      - name: Smoke Test - Verify Auth Routes Served by Next.js
        run: |
          set -e
          sleep 5

          check_route() {
            local path="$1"
            echo "Checking ${path} ..."
            local headers
            # GET thay vi POST body rong: 2 route nay chi export POST, nen Next.js tu tra 405 o tang
            # framework (truoc khi cham vao code Route Handler) - khong bao gio crash du input gi.
            #
            # Kiem tra header "vary: ...next-router-state-tree..." thay vi "x-powered-by: Next.js":
            # da xac nhan qua test truc tiep (localhost, ca 2 phia) - x-powered-by CHI xuat hien tren
            # response 200 thanh cong, KHONG co tren response 405 dieu Next.js tu tra cho method
            # khong duoc export (van la Next.js xu ly, chi la khong qua path gan header nay). Header
            # "vary" chua "next-router-state-tree" thi luon co mat o MOI response do Next.js phuc vu
            # (200/405/500 deu co), va backend .NET (Kestrel) khong bao gio tu them header nay -
            # discriminator dang tin cay hon nhieu.
            headers=$(curl -sS -i --max-time 15 -X GET "https://dichvucloud.duckdns.org${path}")
            echo "$headers" | head -n 15
            if ! echo "$headers" | grep -qi '^vary:.*next-router'; then
              echo "::error::Smoke test FAILED for ${path} - missing 'vary: ...next-router-state-tree...' header, meaning the request is being routed straight to the .NET backend instead of Next.js (this is the exact symptom of the diagnosed login-cookie bug: Nginx may have been overwritten by a Certbot renewal, bypassing the Next.js Route Handler that sets auth cookies)."
              exit 1
            fi
            echo "OK: ${path} is correctly served by Next.js."
          }

          check_route "/api/customer-auth/login"
          check_route "/api/auth/login"
