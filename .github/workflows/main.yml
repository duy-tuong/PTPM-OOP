          script: |
            echo "==== Starting Auto-Deploy Process on VM ===="
            if [ ! -d "PTPM-OOP" ]; then
              git clone https://github.com/${{ github.repository }}.git PTPM-OOP
              cd PTPM-OOP
            else
              cd PTPM-OOP
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "==== Writing .env (PayOS/Resend) from GitHub Secrets ===="
            {
              echo "App__PayOsClientId=${{ secrets.PAYOS_CLIENT_ID }}"
              echo "App__PayOsApiKey=${{ secrets.PAYOS_API_KEY }}"
              echo "App__PayOsChecksumKey=${{ secrets.PAYOS_CHECKSUM_KEY }}"
              echo "App__ResendApiKey=${{ secrets.RESEND_API_KEY }}"
              echo "App__EmailFromAddress=${{ secrets.EMAIL_FROM_ADDRESS }}"
              echo "App__EmailFromName=${{ secrets.EMAIL_FROM_NAME }}"
            } > .env
            echo "==== Building Docker Images & Starting Containers ===="
            docker compose up -d --build --remove-orphans
            docker image prune -f
            echo "==== Updating Nginx Reverse Proxy Config ===="
            sudo bash -c 'cat << "EOF" > /etc/nginx/sites-available/default
server {
    listen 80;
    server_name dichvucloud.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dichvucloud.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/dichvucloud.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dichvucloud.duckdns.org/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOF'
            sudo systemctl reload nginx || true
            echo "==== Deploy Completed Successfully! ===="
