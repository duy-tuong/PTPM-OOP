services:
  # 1. SQL Server Database Container
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloudstore_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CloudServiceStore@2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - cloudstore_net
    # Đã verify thật: lần đầu chạy trên volume rỗng, SQL Server cần > 1 phút để sẵn sàng nhận kết nối
    # (nâng cấp msdb/tempdb) - vượt quá ngân sách retry mặc định phía backend, khiến migration tự động
    # lúc backend khởi động thất bại và KHÔNG thử lại (chỉ chạy 1 lần lúc startup). Healthcheck +
    # depends_on.condition ở service backend bên dưới chặn backend khởi động cho tới khi sqlcmd thật sự
    # kết nối được - bổ sung cho "Connect Retry Count=5" đã có sẵn trong connection string (2 lớp phòng
    # thủ khác nhau cho cùng 1 vấn đề, không loại trừ nhau).
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # 2. Backend Web API Container (.NET 10)
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: cloudstore_backend
    restart: always
    # Khoá PayOS/Resend (App__PayOsClientId, App__PayOsApiKey, App__PayOsChecksumKey, App__ResendApiKey,
    # App__EmailFromAddress, App__EmailFromName) KHÔNG hardcode ở đây như Jwt__SecretKey/ConnectionStrings
    # bên dưới - đọc từ file .env cùng cấp (gitignore, xem .env.example) để không lộ khoá tài chính/email
    # thật vào lịch sử git. Workflow CI/CD (.github/workflows/main.yml) tự sinh file .env này trên VM từ
    # GitHub Secrets trước mỗi lần deploy.
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=cloudstore_sqlserver,1433;Database=CloudServiceStoreDb;User Id=sa;Password=CloudServiceStore@2026!;TrustServerCertificate=True;Connect Retry Count=5;
      - Jwt__SecretKey=CloudServiceStoreSuperSecretKey2026MustBeAtLeast32BytesLong!
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cloudstore_net
    volumes:
      # Ảnh admin upload (AdminUploadsController.cs -> LocalFileStorageService.cs, lưu wwwroot/uploads)
      # - gắn volume bền vững để không mất ảnh mỗi lần container tái tạo.
      - uploads_data:/app/wwwroot/uploads

  # 3. Frontend Next.js Container
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://35.254.67.105:5000/api
    container_name: cloudstore_frontend
    restart: always
    environment:
      - API_URL=http://backend:5000/api
      - NEXT_PUBLIC_API_URL=https://dichvucloud.duckdns.org/api
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - cloudstore_net

volumes:
  mssql_data:
  uploads_data:

networks:
  cloudstore_net:
    driver: bridge
